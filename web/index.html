  .field {

  /* account */
  .acct .card { max-width: 420px; padding: 20px; max-height: 88vh; overflow-y: auto; }
  .acct h2 { font-size: 19px; margin: 0 0 2px; font-weight: 600; }

  .acct section { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 14px; }

  tier.replayDays = row.replay_days;   // null = full history

}
/* ---------- buzz ----------
   The ring, synthesized rather than fetched: no asset, no CORS, no load delay,
   and it can't fail to arrive. Same motif as the app's buzz.wav — two soft
   sine partials a fifth apart, struck twice, twice. */
const RING_STRIKES = [0, 0.7, 1.65, 2.35]; // seconds
const RING_PARTIALS = [[659.25, 1.0], [987.77, 0.55], [1318.5, 0.18]];
let audioCtx = null;

function ringAudio() {
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime + 0.02;
    for (const at of RING_STRIKES) {
      for (const [freq, amp] of RING_PARTIALS) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        // struck bell: near-instant attack, long exponential decay
        gain.gain.setValueAtTime(0.0001, t0 + at);
        gain.gain.exponentialRampToValueAtTime(amp * 0.22, t0 + at + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.55);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0 + at);
        osc.stop(t0 + at + 0.6);
      }
    }
  } catch { /* audio is a bonus; the flash and the buzz still land */ }
}

// Browsers won't let a page make noise before the user has touched it, so
// unlock the context on the first interaction — long before any buzz arrives.

  window.addEventListener(ev, () => {
    try {
      audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch { /* not available in this browser */ }
  }, { once: true }));

const photosLeft = () =>
  tier.photoLimit == null ? Infinity : Math.max(0, tier.photoLimit - tier.photosToday);
const app = document.getElementById("app");
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* A password-recovery link carries its own session in the URL fragment. Detect
   it before boot decides anything, or the user lands on their canvas with no
   chance to set the new password they came here for. */
const IS_RECOVERY = /(^|[#&])type=recovery(&|$)/.test(location.hash);
// A confirmation link carries a session too, and lands them straight in.
const IS_CONFIRM = /(^|[#&])type=signup(&|$)/.test(location.hash);

(async function boot() {
  if (IS_RECOVERY) return renderRecovery();
  if (IS_CONFIRM) history.replaceState(null, "", location.pathname + location.search);
  const { data: { session } } = await supabase.auth.getSession();
  if (session) return openCanvas();
  renderSignIn();
})();

supabase.auth.onAuthStateChange((event, session) => {
  if (IS_RECOVERY) return; // the recovery screen owns this session
  if (event === "SIGNED_IN" && session && !window.__inCanvas && !window.__onboarding) openCanvas();
});

function renderRecovery() {
  window.__inCanvas = false; window.__onboarding = true;
  app.innerHTML = `
    <div class="signin">
      <div class="wordmark">tra<span class="ce">ce</span></div>
      <div class="h1">a new<br/><span class="ink">password.</span></div>
      <div class="sub">Choose something you'll remember. You'll be signed straight in.</div>
      <input class="field" id="np" type="password" placeholder="new password" autocomplete="new-password" />
      <button class="btn" id="npgo">Set password</button>
      <div class="err" id="nperr"></div>
      <button class="linkish" id="npback">Back to sign in</button>
    </div>`;
  const np = document.getElementById("np");
  const err = document.getElementById("nperr");
  const go = document.getElementById("npgo");
  np.focus();

  async function submit() {
    if (np.value.length < 6) { err.textContent = "Use at least 6 characters."; return; }
    go.disabled = true; go.textContent = "saving…"; err.textContent = "";
    const { error } = await supabase.auth.updateUser({ password: np.value });
    go.disabled = false; go.textContent = "Set password";
    if (error) { err.textContent = "That link has expired — send yourself a new one."; return; }
    history.replaceState(null, "", location.pathname + location.search);

  document.getElementById("npback").addEventListener("click", async () => {

function renderSignIn() {
  window.__inCanvas = false; window.__onboarding = false;
  clearInterval(window.__waitTimer);
  app.innerHTML = `
    <div class="signin">
      <div class="wordmark">tra<span class="ce">ce</span></div>
      <h1 class="h1">Leave me<br/>a <span class="ink">trace.</span></h1>
      <p class="sub">Whatever one of you draws appears on the other's phone — stroke by stroke, in real time.</p>

      <input class="field" id="email" type="email" inputmode="email" autocomplete="email"
             placeholder="your email" autocapitalize="none" />
      <input class="field" id="password" type="password" placeholder="your password" autocomplete="current-password" />
      <button class="btn" id="enter">Enter</button>
      <div class="err" id="err"></div>
      <div class="hint">First time? Enter creates your account.<br/>Coming back? It signs you in.</div>
      <button class="linkish" id="forgot">Forgot your password?</button>
    </div>`;

  const err = document.getElementById("err");
  // null-safe: signIn() can swap the whole screen (check-inbox) before its
  // finally block runs, at which point #enter no longer exists
  const setBusy = (b) => { const el = document.getElementById("enter"); if (el) el.disabled = b; };

  document.getElementById("enter").addEventListener("click", () => {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    if (!email.includes("@")) return (err.textContent = "Enter your email — that's your account name.");
    if (password.length < 6) return (err.textContent = "Pick a password of at least 6 characters.");
    signIn(email, password, err, setBusy);
  });
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("enter").click();
  });

  document.getElementById("forgot").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim().toLowerCase();
    if (!email.includes("@")) return (err.textContent = "Type your email above first.");
    setBusy(true);
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: location.href.split("#")[0],
    });
    setBusy(false);
    // Deliberately says the same thing either way — whether an email has an
    // account here isn't something a stranger should be able to probe.
    err.style.color = error ? "" : "var(--muted)";
    err.textContent = error
      ? "Couldn't send that just now — try again shortly."
      : "If that email has an account, a reset link is on its way.";
  });
}

async function signIn(email, password, err, setBusy) {
  err.textContent = ""; setBusy(true);
  try {
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (!error) return;

    // The account exists but was never confirmed — an unfinished step, not a
    // failure. (Only reachable once "Confirm email" is on in Supabase.)
    if (/email not confirmed|email_not_confirmed/i.test(error.message ?? "")) {
      return renderCheckInbox(email);
    }

    // No account yet? Create one through Supabase's standard signup, so the
    // confirmation email is sent (or not) purely by the project's setting —
    // the old trace-signup endpoint minted PRE-CONFIRMED accounts, which made
    // a typo'd address unrecoverable forever.
    const { data, error: upErr } = await supabase.auth.signUp({
      email, password, options: { emailRedirectTo: location.href.split("#")[0] },
    });
    if (upErr) {
      err.textContent = /already|registered|exists/i.test(upErr.message)
        ? "That email already has an account — check the password."
        : "Couldn't create your account — try again.";
      return;
    }
    // Supabase won't confirm to a stranger that an address is taken; it returns
    // a user with no identities instead. That's a wrong password, not a signup.
    if (data.user && (data.user.identities?.length ?? 0) === 0) {
      err.textContent = "That email already has an account — check the password.";
      return;
    }
    if (!data.session) return renderCheckInbox(email);
  } catch (e) {
    err.textContent = "Network hiccup — try again.";
  } finally { setBusy(false); }
}

  const friendly = (m) =>
    m.includes("invalid_code") ? "That code doesn't match a canvas — check it with your person." :
    m.includes("couple_full") ? "That canvas already has its two people." :
    m.includes("too_many_attempts") ? "Too many tries — wait a bit and try again." :
    m.includes("already_in_couple") ? "" :
    "Something hiccuped — try again.";

  document.getElementById("startBtn").addEventListener("click", async () => {
    perr.textContent = "";

    window.__onboarding = false; openCanvas();
  });

  const codeInput = document.getElementById("codeInput");
  const joinGo = document.getElementById("joinGo");
  document.getElementById("joinBtn").addEventListener("click", () => {
    codeInput.style.display = "block"; joinGo.style.display = "block";
    document.getElementById("joinBtn").classList.add("sel");
    codeInput.focus();
  });
  joinGo.addEventListener("click", async () => {
    perr.textContent = "";
    const code = codeInput.value.trim().toUpperCase();
    if (code.length !== 6) { perr.textContent = "The code is 6 characters."; return; }
    joinGo.disabled = true;
    const { error } = await supabase.rpc("join_couple", { p_code: code, p_display_name: name() });
    joinGo.disabled = false;
    if (error && !error.message.includes("already_in_couple")) { perr.textContent = friendly(error.message); return; }
    window.__onboarding = false; openCanvas();
  });
  codeInput.addEventListener("keydown", e => { if (e.key === "Enter") joinGo.click(); });

  document.getElementById("pout").addEventListener("click", async () => {
    await supabase.auth.signOut(); renderSignIn();
  });
}

async function renderWaiting(user, coupleId, myName) {
  window.__inCanvas = false; window.__onboarding = true;
  clearInterval(window.__waitTimer);
  const { data: c } = await supabase.from("couples").select("invite_code").eq("id", coupleId).maybeSingle();
  const code = c?.invite_code || "······";
  app.innerHTML = `
    <div class="signin">

      <h1 class="h1">Now invite<br/>your <span class="ink">person.</span></h1>

      <div class="codebox glass">

      </div>

        <button class="choice glass" id="shareBtn"><b>Share…</b><span>text it to them</span></button>
      </div>
      <div class="err" id="werr"></div>
      <button class="btn" id="drawAnyway">Draw while you wait</button>
      <button class="linkish" id="wout">Sign out</button>
    </div>`;

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(code);
      document.getElementById("copyHint").textContent = "copied ✓"; } catch {}
  });
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const text = `Leave me a trace — draw with me. Open ${location.href} and enter our code: ${code}`;
    if (navigator.share) { try { await navigator.share({ text }); } catch {} }
    else { try { await navigator.clipboard.writeText(text);
      document.getElementById("copyHint").textContent = "invite copied ✓"; } catch {} }
  });
  document.getElementById("drawAnyway").addEventListener("click", () => {
    clearInterval(window.__waitTimer);
    window.__drawAlone = true; window.__onboarding = false; openCanvas();
  });
  document.getElementById("wout").addEventListener("click", async () => {
    clearInterval(window.__waitTimer);
    await supabase.auth.signOut(); renderSignIn();
  });

  window.__waitTimer = setInterval(async () => {
    const { data } = await supabase.from("members").select("user_id").eq("couple_id", coupleId);
    if (data && data.length >= 2) {
      clearInterval(window.__waitTimer);
      window.__onboarding = false; openCanvas();
    }
  }, 4000);
}

async function openCanvas() {
  if (window.__inCanvas) return;
  window.__inCanvas = true;
  app.innerHTML = `<div class="loading">opening your canvas…</div>`;

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { window.__inCanvas = false; return renderSignIn(); }

  const { data: me } = await supabase.from("members")
    .select("couple_id, display_name").eq("user_id", user.id).maybeSingle();

  if (!me) { window.__inCanvas = false; return renderPairing(user); }

  const coupleId = me.couple_id;
  const myName = me.display_name || "You";
  const { data: canvasRow } = await supabase.from("canvases")
    .select("id, photo_url").eq("couple_id", coupleId).eq("kind", "shared").limit(1).maybeSingle();
  const canvasId = canvasRow?.id;
  const photoUrl = canvasRow?.photo_url || null;
  const { data: partnerRow } = await supabase.from("members")
    .select("display_name").eq("couple_id", coupleId).neq("user_id", user.id).maybeSingle();

  if (!partnerRow && !window.__drawAlone) {
    window.__inCanvas = false;
    return renderWaiting(user, coupleId, myName);
  }
  const partnerName = partnerRow?.display_name || "your person";

  await refreshTier();
  renderCanvasUI({ user, coupleId, canvasId, myName, partnerName, photoUrl });
}

  let brush = "marker";
  let view = "all";
  let W = 0, H = 0, dpr = 1;
  let bgState = null; // { url, fit, dim }
  let revealing = false; // invisible ink is only drawn while the eye is held
  // Ring lights up once you've left something — buzz them to a trace, not to
  // an empty canvas.
  let ringReady = false;

  const strokes = [];
  const live = new Map();

  // widget snapshot: debounced server-side re-render after canvas changes
  let snapTimer = null;
  const queueSnapshot = () => {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() =>
      supabase.functions.invoke("render-snapshot", { body: { coupleId } }).catch(() => {}), 2500);
  };

  /* ---------- background photo state ---------- */
  function parseBg(u) {
    if (!u) return null;
    const [url, frag = ""] = u.split("#");
    const p = new URLSearchParams(frag);
    return { url, fit: p.get("fit") === "contain" ? "contain" : "cover",
             dim: p.get("dim") != null ? Math.max(0, Math.min(70, +p.get("dim") || 0)) : 35 };
  }
  const bgString = () => bgState ? `${bgState.url}#fit=${bgState.fit}&dim=${bgState.dim}` : null;
  // photo refs are private storage paths; resolve to a short-lived signed URL for display
  async function resolveBgSrc(ref) {
    if (/^(https?:|blob:|data:)/.test(ref)) return ref;
    const { data } = await supabase.storage.from("couple-photos").createSignedUrl(ref, 604800);
    return data?.signedUrl || null;
  }
  function setBg(u) {
    bgState = parseBg(u);
    if (bgState) {
      const ref = bgState.url;
      resolveBgSrc(ref).then(src => {
        if (bgState && bgState.url === ref && src) bgimg.src = src;
      });
      bgimg.style.objectFit = bgState.fit;
      bgimg.style.display = "block";
      bgdim.style.opacity = bgState.dim / 100;
      bgdim.style.display = "block";
      bgtools.style.display = "flex";
      document.querySelectorAll("#fitseg div").forEach(d =>
        d.classList.toggle("sel", d.dataset.fit === bgState.fit));
      dimrange.value = bgState.dim;
    } else {
      bgimg.removeAttribute("src"); bgimg.style.display = "none";
      bgdim.style.display = "none"; bgtools.style.display = "none";
      bgpanel.style.display = "none";
    }
  }
  setBg(ctx.photoUrl);

  async function persistBg(broadcast = true) {
    const val = bgString();
    if (canvasId) {
      const { error } = await supabase.from("canvases").update({ photo_url: val }).eq("id", canvasId);
      // the daily photo limit is enforced by the DB, so this is the real answer
      if (error) return error;
    }
    if (broadcast && subscribed) channel.send({ type: "broadcast", event: "canvas:bg", payload: { url: val } });
    queueSnapshot();
    return null;
  }
  const isPhotoLimit = (e) => /FREE_PHOTO_LIMIT/.test(e?.message ?? "");
  document.getElementById("bgopts").addEventListener("click", () => {
    bgpanel.style.display = bgpanel.style.display === "block" ? "none" : "block";
  });
  document.querySelectorAll("#fitseg div").forEach(d => d.addEventListener("click", () => {
    if (!bgState) return;
    bgState.fit = d.dataset.fit;
    bgimg.style.objectFit = bgState.fit;
    document.querySelectorAll("#fitseg div").forEach(x => x.classList.toggle("sel", x === d));
    persistBg();
  }));
  let dimTimer = null;
  dimrange.addEventListener("input", () => {
    if (!bgState) return;
    bgState.dim = +dimrange.value;
    bgdim.style.opacity = bgState.dim / 100;
    clearTimeout(dimTimer); dimTimer = setTimeout(() => persistBg(), 350);
  });
  document.getElementById("removebg").addEventListener("click", async () => {
    setBg(null);
    if (canvasId) await supabase.from("canvases").update({ photo_url: null }).eq("id", canvasId);
    if (subscribed) channel.send({ type: "broadcast", event: "canvas:bg", payload: { url: null } });
    queueSnapshot();
  });

  /* ---------- views ---------- */
  document.querySelectorAll(".view").forEach(v => v.addEventListener("click", () => {
    view = v.dataset.view;
    document.querySelectorAll(".view").forEach(x => x.classList.remove("sel"));
    v.classList.add("sel");
    render();
  }));
  const visible = (s) =>
    view === "all" ? true : view === "mine" ? s.authorId === user.id : s.authorId !== user.id;

  /* ---------- tier surface ---------- */
  const tierPill = document.getElementById("tierpill");
  const revealBtn = document.getElementById("reveal");

  function syncTierUI() {
    tierPill.className = "tier glass" + (tier.isPro ? "" : " free");
    tierPill.innerHTML = tier.isPro
      ? `${icon("heart", 13)}<span>Forever</span>`
      : `${icon("lock", 13)}<span>Unlock</span>`;
    tierPill.title = tier.isPro
      ? "Trace Forever — every brush, unlimited photos, your whole story"
      : `Trace Forever — ${PRICE}, unlocks both of you`;

    document.querySelectorAll(".brush").forEach(b => {
      const locked = brushLocked(b.dataset.brush);
      b.classList.toggle("locked", locked);
      let badge = b.querySelector(".lock");
      if (locked && !badge) b.insertAdjacentHTML("beforeend", `<span class="lock">${icon("lock", 10)}</span>`);
      if (!locked && badge) badge.remove();
    });

    // the reveal button only matters once there's something hidden to reveal
    revealBtn.classList.toggle("hidden", !strokes.some(s => s.brush === "invisible"));
  }
  tierPill.addEventListener("click", () => openPaywall("info", () => { syncTierUI(); render(); }));

  /* ---------- brushes & colors ---------- */
  function selectBrush(name) {
    brush = name;
    document.querySelectorAll(".brush").forEach(x =>
      x.classList.toggle("sel", x.dataset.brush === name));
  }
  document.querySelectorAll(".brush").forEach(b => b.addEventListener("click", () => {
    const want = b.dataset.brush;
    if (brushLocked(want)) {
      openPaywall("brush", () => { syncTierUI(); selectBrush(want); });
      return;
    }
    selectBrush(want);
  }));

  /* ---------- live: let them watch you draw ----------
     Frames, not video. A small JPEG a couple of times a second, sent over the
     realtime channel you're already on and thrown away the moment it's drawn.
     Nothing is uploaded, nothing is written to the database, nothing is
     recorded — the frame exists in two browsers for a few hundred milliseconds
     and then it's gone.

     Real video would mean WebRTC: a heavy native dependency on the phone, plus
     TURN servers to punch through NATs. For "let them see my face while I
     draw", frames are the honest trade — a little choppy, infinitely simpler,
     and impossible to accidentally persist. */
  const LIVE_FPS_MS = 700;   // ~1.4 frames a second
  const LIVE_W = 192;        // tiny on purpose: ~8KB a frame
  const LIVE_H = 256;
  const LIVE_QUALITY = 0.45;
  const LIVE_MAX_MS = 5 * 60 * 1000;  // never leave a camera on forever
  const LIVE_STALE_MS = 4000;         // hide their pane if frames stop

  const liveBtn = document.getElementById("livebtn");
  const livePane = document.getElementById("livepane");
  const liveImg = document.getElementById("liveimg");
  const liveCap = document.getElementById("livecap");
  const liveSelf = document.getElementById("liveself");
  let liveStream = null, liveVideo = null, liveTimer = null, liveStopTimer = null;
  let liveStaleTimer = null, partnerOnline = false;

  async function startLive() {
    if (liveStream) return;
    try {
      liveStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: "user" },
        audio: false, // this is a glimpse, not a call
      });
    } catch {
      pilltext.textContent = "camera blocked — check your browser permissions";
      pill.classList.add("show");
      setTimeout(() => pill.classList.remove("show"), 2600);
      return;
    }
    liveVideo = document.createElement("video");
    liveVideo.srcObject = liveStream;
    liveVideo.muted = true; liveVideo.playsInline = true;
    await liveVideo.play().catch(() => {});

    const cv2 = document.createElement("canvas");
    cv2.width = LIVE_W; cv2.height = LIVE_H;
    const g2 = cv2.getContext("2d");

    liveBtn.classList.add("live");
    liveBtn.innerHTML = icon("camoff", 17);
    liveBtn.title = "Stop letting them watch";
    liveSelf.style.display = "flex";

    liveTimer = setInterval(() => {
      if (!liveVideo || liveVideo.readyState < 2) return;
      // don't broadcast into an empty room
      if (!subscribed || !partnerOnline) return;
      // mirror it, so they see you the way you see yourself
      g2.save();
      g2.translate(LIVE_W, 0); g2.scale(-1, 1);
      const vw = liveVideo.videoWidth || 320, vh = liveVideo.videoHeight || 240;
      const scale = Math.max(LIVE_W / vw, LIVE_H / vh);
      const dw = vw * scale, dh = vh * scale;
      g2.drawImage(liveVideo, (LIVE_W - dw) / 2, (LIVE_H - dh) / 2, dw, dh);
      g2.restore();
      channel.send({
        type: "broadcast", event: "live:frame",
        payload: { from: user.id, f: cv2.toDataURL("image/jpeg", LIVE_QUALITY) },
      });
    }, LIVE_FPS_MS);

    if (subscribed) channel.send({ type: "broadcast", event: "live:on", payload: { from: user.id } });
    clearTimeout(liveStopTimer);
    liveStopTimer = setTimeout(() => stopLive("timed out after 5 minutes"), LIVE_MAX_MS);
  }

  function stopLive(reason) {
    if (!liveStream) return;
    clearInterval(liveTimer); liveTimer = null;
    clearTimeout(liveStopTimer); liveStopTimer = null;
    liveStream.getTracks().forEach(t => t.stop()); // releases the camera light
    liveStream = null; liveVideo = null;
    liveBtn.classList.remove("live");
    liveBtn.innerHTML = icon("cam", 17);
    liveBtn.title = "Let them watch you draw";
    liveSelf.style.display = "none";
    if (subscribed) channel.send({ type: "broadcast", event: "live:off", payload: { from: user.id } });
    if (reason) {
      pilltext.textContent = `camera off — ${reason}`;
      pill.classList.add("show");
      setTimeout(() => pill.classList.remove("show"), 2600);
    }
  }

  liveBtn.addEventListener("click", () => (liveStream ? stopLive() : startLive()));

  function showPartnerFrame(dataUrl) {
    liveImg.src = dataUrl;
    liveCap.textContent = partnerName;
    livePane.style.display = "block";
    clearTimeout(liveStaleTimer);
    liveStaleTimer = setTimeout(hidePartnerFrame, LIVE_STALE_MS);
  }
  function hidePartnerFrame() {
    clearTimeout(liveStaleTimer);
    livePane.style.display = "none";
    liveImg.removeAttribute("src"); // don't leave their face in the DOM
  }

  // Leaving the page, backgrounding the tab, or signing out all cut the camera.
  window.addEventListener("pagehide", () => stopLive());
  window.addEventListener("beforeunload", () => stopLive());

  /* ---------- buzz: ring their phone ---------- */
  const ringBtn = document.getElementById("ring");
  const buzzTag = document.getElementById("buzztag");
  let ringCooldown = 0, ringTimer = null;

  function paintRing() {
    ringBtn.classList.toggle("cooling", ringCooldown > 0);
    ringBtn.classList.toggle("ready", ringCooldown === 0 && ringReady);
    ringBtn.innerHTML = ringCooldown > 0
      ? `${icon("bell", 17)}<span class="cd">${ringCooldown}</span>`
      : icon("bell", 17);
    ringBtn.title = ringCooldown > 0
      ? `give them a moment — ${ringCooldown}s`
      : "Ring their phone";
  }
  function startCooldown(seconds) {
    ringCooldown = seconds;
    paintRing();
    clearInterval(ringTimer);
    ringTimer = setInterval(() => {
      ringCooldown--;
      if (ringCooldown <= 0) { clearInterval(ringTimer); ringCooldown = 0; }
      paintRing();
    }, 1000);
  }

  /** What a buzz feels like on this end. */
  function receiveBuzz() {
    ringAudio();
    if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 600]);
    board.classList.remove("buzzing");
    void board.offsetWidth; // restart the animation
    board.classList.add("buzzing");
    buzzTag.textContent = `${partnerName} is thinking about you`;
    buzzTag.classList.add("show");
    setTimeout(() => {
      buzzTag.classList.remove("show");
      board.classList.remove("buzzing");
    }, 3400);
  }

  ringBtn.addEventListener("click", async () => {
    if (ringCooldown > 0) return;
    ringReady = false;
    // ring their app instantly if it's open...
    if (subscribed) channel.send({ type: "broadcast", event: "buzz", payload: { from: user.id } });
    // ...and push to their phone if it isn't. The server owns the rate limit.
    startCooldown(120);
    let res = null;
    try {
      const r = await supabase.functions.invoke("buzz-partner", { body: { coupleId } });
      res = r.data;
    } catch { /* handled below */ }
    if (res?.sent) {
      pilltext.textContent = `ringing ${partnerName}…`;
    } else if (res?.retryAfter) {
      startCooldown(res.retryAfter);
      pilltext.textContent = `give them a moment — ${res.retryAfter}s`;
    } else if (res?.skipped === "partner has no push token") {
      pilltext.textContent = `rang their app — their phone can't be reached yet`;
    } else {
      pilltext.textContent = `couldn't reach them just now`;
    }
    pill.classList.add("show");
    setTimeout(() => pill.classList.remove("show"), 2600);
  });
  paintRing();

  /* ---------- invisible ink: hold the eye to reveal ---------- */
  let revealTimer = null;
  const startReveal = () => {
    revealing = true;
    revealBtn.classList.add("on");
    render();
    clearTimeout(revealTimer);
    revealTimer = setTimeout(endReveal, 6000); // never leave secrets on screen
  };
  const endReveal = () => {
    if (!revealing) return;
    revealing = false;
    revealBtn.classList.remove("on");
    clearTimeout(revealTimer);
    render();
  };
  revealBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); startReveal(); });
  revealBtn.addEventListener("pointerup", endReveal);
  revealBtn.addEventListener("pointercancel", endReveal);
  revealBtn.addEventListener("pointerleave", endReveal);
  const sw = document.getElementById("swatches");
  SWATCHES.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "swatch" + (i === 0 ? " sel" : "");
    el.style.background = c;
    if (c === "#ffffff") el.style.border = "2px solid rgba(0,0,0,.25)";
    el.addEventListener("click", () => {
      color = c; document.querySelectorAll(".swatch").forEach(s => s.classList.remove("sel")); el.classList.add("sel");
    });
    sw.appendChild(el);
  });

  /* ---------- canvas ---------- */
  function resize() {
    const r = board.getBoundingClientRect();
    W = r.width; H = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }
  window.addEventListener("resize", resize);
  setTimeout(resize, 0);

  function drawStroke(s, forceReveal = false) {
    const pts = s.points;
    if (!pts.length) return;
    const w = Math.max(1.5, s.width * W);
    const b = s.brush || "marker";
    if (b === "invisible") {
      // held: a warm shimmer. released: barely a smudge on the glass, so you
      // know something is there without being able to read it.
      if (revealing || forceReveal) { g.globalAlpha = 0.88; g.shadowColor = s.color; g.shadowBlur = w * 1.2; g.lineWidth = w; }
      // Not revealed: blurred past legibility. A low-alpha copy of the real
      // stroke would still be readable — the whole point is that they can see
      // something is waiting without being able to read it yet.
      else { g.globalAlpha = 0.20; g.shadowBlur = 0; g.lineWidth = w * 1.1; g.filter = `blur(${Math.max(5, w * 0.9)}px)`; }
    }
    else if (b === "glow") { g.globalAlpha = 0.9; g.shadowColor = s.color; g.shadowBlur = w * 1.6; g.lineWidth = w; }
    else if (b === "neon") { g.globalAlpha = 1; g.shadowColor = s.color; g.shadowBlur = w * 2.6; g.lineWidth = w * 0.75; }
    else if (b === "chalk") { g.globalAlpha = 0.45; g.shadowBlur = 0; g.lineWidth = w * 1.15; }
    else { g.globalAlpha = 0.85; g.shadowBlur = 0; g.lineWidth = w; }
    g.strokeStyle = s.color; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath();
    g.moveTo(pts[0][0] * W, pts[0][1] * H);
    if (pts.length === 1) g.lineTo(pts[0][0] * W + 0.1, pts[0][1] * H + 0.1);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] * W, pts[i][1] * H);
    g.stroke();
    if (b === "neon") {
      g.shadowBlur = 0; g.globalAlpha = 0.9; g.strokeStyle = "#ffffff"; g.lineWidth = Math.max(1, w * 0.22);
      g.stroke();
    }
    g.shadowBlur = 0; g.globalAlpha = 1; g.filter = "none";
  }
  function render() {
    if (replay.active) { renderReplay(); return; }
    g.clearRect(0, 0, W, H);
    let shown = 0;
    for (const s of strokes) if (visible(s)) { drawStroke(s); shown++; }
    // your own in-progress stroke always renders — you can't write with ink you
    // can't see. It fades to a smudge the moment you lift, and your partner
    // never sees it appear at all.
    for (const s of live.values()) if (visible(s)) { drawStroke(s, s === drawingStroke); shown++; }
    empty.style.opacity = shown ? 0 : 1;
  }

  /* ---------- Relationship Replay ---------- */
  const replay = { active: false, playing: false, snap: [], total: 0, idx: 0, raf: 0, last: 0 };
  const rbar = document.getElementById("replaybar");
  const rtag = document.getElementById("replaytag");
  const rslider = document.getElementById("rslider");
  const rplayBtn = document.getElementById("rplay");
  const SPEED = 220; // points per second

  document.getElementById("replaybtn").addEventListener("click", () => {
    if (!strokes.length) {
      pilltext.textContent = "nothing to replay yet — draw something first";
      pill.classList.add("show"); setTimeout(() => pill.classList.remove("show"), 2200);
      return;
    }
    // Invisible ink stays out of the replay — same reason it stays off the
    // widget. Free couples replay the last `replayDays`; Pro replays it all.
    let snap = strokes.filter(s => s.brush !== "invisible");
    let trimmed = 0;
    if (tier.replayDays != null) {
      const cutoff = Date.now() - tier.replayDays * 86400000;
      const before = snap.length;
      // strokes drawn this session have no createdAt yet — they're always recent
      snap = snap.filter(s => !s.createdAt || Date.parse(s.createdAt) >= cutoff);
      trimmed = before - snap.length;
    }
    if (!snap.length) {
      openPaywall("replay", () => { syncTierUI(); document.getElementById("replaybtn").click(); });
      return;
    }
    if (trimmed) {
      pilltext.textContent = `showing the last ${tier.replayDays} days — ${trimmed} older stroke${trimmed > 1 ? "s" : ""} need Forever`;
      pill.classList.add("show"); setTimeout(() => pill.classList.remove("show"), 3200);
    }
    replay.snap = snap;
    replay.total = replay.snap.reduce((n, s) => n + s.points.length, 0);
    replay.idx = 0; replay.active = true;
    rslider.max = replay.total; rslider.value = 0;
    rbar.style.display = "flex"; rtag.style.display = "block";
    empty.style.opacity = 0;
    startReplayPlayback();
  });
  function startReplayPlayback() {
    replay.playing = true;
    rplayBtn.innerHTML = icon("pause", 16);
    replay.last = performance.now();
    cancelAnimationFrame(replay.raf);
    const tick = (t) => {
      if (!replay.playing || !replay.active) return;
      replay.idx = Math.min(replay.total, replay.idx + ((t - replay.last) / 1000) * SPEED);
      replay.last = t;
      rslider.value = Math.round(replay.idx);
      renderReplay();
      if (replay.idx >= replay.total) { pauseReplayPlayback(); return; }
      replay.raf = requestAnimationFrame(tick);
    };
    replay.raf = requestAnimationFrame(tick);
  }
  function pauseReplayPlayback() {
    replay.playing = false;
    rplayBtn.innerHTML = icon("play", 16);
    cancelAnimationFrame(replay.raf);
  }
  rplayBtn.addEventListener("click", () => {
    if (replay.playing) { pauseReplayPlayback(); return; }
    if (replay.idx >= replay.total) replay.idx = 0;
    startReplayPlayback();
  });
  rslider.addEventListener("input", () => {
    pauseReplayPlayback();
    replay.idx = +rslider.value;
    renderReplay();
  });
  document.getElementById("rclose").addEventListener("click", () => {
    pauseReplayPlayback();
    replay.active = false;
    rbar.style.display = "none"; rtag.style.display = "none";
    render();
  });
  function renderReplay() {
    g.clearRect(0, 0, W, H);
    let remaining = Math.round(replay.idx);
    for (const s of replay.snap) {
      if (remaining <= 0) break;
      const take = Math.min(remaining, s.points.length);
      drawStroke({ ...s, points: s.points.slice(0, take) });
      remaining -= take;
    }
  }

  /* ---------- Daily Love Streak ---------- */
  const streakEl = document.getElementById("streak");
  const streakN = document.getElementById("streakn");
  const localDay = (d) => {
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };
  async function markToday() {
    try {
      await supabase.from("daily_marks").upsert(
        { couple_id: coupleId, day: localDay(new Date()), user_id: user.id },
        { onConflict: "couple_id,day,user_id", ignoreDuplicates: true });
    } catch (e) { /* streak is decoration; never block drawing */ }
    refreshStreak();
  }
  async function refreshStreak() {
    const since = new Date(); since.setDate(since.getDate() - 90);
    const { data } = await supabase.from("daily_marks")
      .select("day, user_id").eq("couple_id", coupleId).gte("day", localDay(since));
    if (!data) return;
    const days = {};
    for (const r of data) (days[r.day] ??= new Set()).add(r.user_id);
    const both = (k) => days[k] && days[k].size >= 2;
    const cursor = new Date();
    if (!both(localDay(cursor))) cursor.setDate(cursor.getDate() - 1); // today not complete yet — count from yesterday
    let n = 0;
    while (both(localDay(cursor))) { n++; cursor.setDate(cursor.getDate() - 1); }
    streakN.textContent = n;
    streakEl.classList.toggle("zero", n === 0);
    streakEl.title = n ? `${n}-day streak — you both drew ${n} day${n > 1 ? "s" : ""} in a row` : "Draw on the same day as your person to start a streak";
  }

  /* ---------- realtime ---------- */
  let channel = null, subscribed = false;
  let sendBuf = [], sendTimer = null, curStrokeId = null;

  async function connect() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) supabase.realtime.setAuth(session.access_token);
    channel = supabase.channel(`trace:couple:${coupleId}`, {
      config: { private: true, broadcast: { self: false }, presence: { key: user.id } },
    });

    channel.on("broadcast", { event: "stroke:start" }, ({ payload }) => {
      live.set(payload.strokeId, { authorId: payload.authorId, color: payload.color, width: payload.width,
        brush: payload.brush || "marker", points: payload.pt ? [payload.pt] : [] });
      render();
    });
    channel.on("broadcast", { event: "stroke:points" }, ({ payload }) => {
      const s = live.get(payload.strokeId);
      if (!s) return;
      for (const p of payload.pts) s.points.push(p);
      render();
    });
    channel.on("broadcast", { event: "stroke:end" }, ({ payload }) => {
      const s = live.get(payload.strokeId);
      if (s) { strokes.push(s); live.delete(payload.strokeId); render(); syncTierUI(); refreshStreak(); }
    });
    channel.on("broadcast", { event: "canvas:clear" }, () => {
      strokes.length = 0; live.clear(); render(); syncTierUI();
    });
    channel.on("broadcast", { event: "canvas:reload" }, async () => {
      live.clear(); await loadHistory();
    });
    channel.on("broadcast", { event: "canvas:bg" }, ({ payload }) => {
      setBg(payload.url || null);
    });
    // Their app is open, so no push will fire — ring it here instead. Same
    // fast path as strokes.
    channel.on("broadcast", { event: "buzz" }, () => receiveBuzz());
    channel.on("broadcast", { event: "live:frame" }, ({ payload }) => showPartnerFrame(payload.f));
    channel.on("broadcast", { event: "live:off" }, () => hidePartnerFrame());
    channel.on("presence", { event: "sync" }, () => {
      const state = channel.presenceState();
      let online = false, drawing = false;
      for (const key in state) {
        if (key === user.id) continue;
        online = true;
        for (const m of state[key]) if (m.drawing) drawing = true;
      }
      partnerOnline = online;
      if (!online) hidePartnerFrame(); // they left; drop their last frame
      document.getElementById("pdot").classList.toggle("on", online);
      document.getElementById("pwho").textContent = online ? partnerName : partnerName + " (offline)";
      if (drawing) { pilltext.textContent = `${partnerName} is drawing…`; pill.classList.add("show"); }
      else pill.classList.remove("show");
    });

    channel.subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        subscribed = true;
        await channel.track({ userId: user.id, name: myName, drawing: false });
        await loadHistory();
        refreshStreak();
      }
    });
  }

  async function loadHistory() {
    if (!canvasId) return;
    const { data } = await supabase.from("strokes")
      .select("id, author_id, brush, color, width, points, created_at")
      .eq("canvas_id", canvasId).order("id", { ascending: true });
    if (data) {
      strokes.length = 0;
      for (const row of data) strokes.push({ id: row.id, authorId: row.author_id, brush: row.brush,
        color: row.color, width: row.width, points: row.points, createdAt: row.created_at });
      render();
      syncTierUI();
    }
  }

  function flushPoints() {
    if (!sendBuf.length || !subscribed) { sendTimer = null; return; }
    const pts = sendBuf; sendBuf = []; sendTimer = null;
    channel.send({ type: "broadcast", event: "stroke:points", payload: { strokeId: curStrokeId, pts } });
  }
  function queuePoint(p) {
    sendBuf.push(p);
    if (!sendTimer) sendTimer = setTimeout(flushPoints, 25);
  }

  /* ---------- drawing input ---------- */
  let drawingStroke = null;
  const norm = (e) => {
    const r = board.getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width), clamp((e.clientY - r.top) / r.height)];
  };
  function setDrawingFlag(v) { if (subscribed) channel.track({ userId: user.id, name: myName, drawing: v }); }

  board.addEventListener("pointerdown", (e) => {
    if (replay.active) return;
    if (e.target.closest(".bgtools, .bgpanel, .replaybar, .progresswrap")) return;
    if (e.button != null && e.button !== 0 && e.pointerType === "mouse") return;
    bgpanel.style.display = "none";
    board.setPointerCapture(e.pointerId);
    curStrokeId = uid();
    drawingStroke = { authorId: user.id, color, brush, width: STROKE_W, points: [norm(e)] };
    live.set(curStrokeId, drawingStroke);
    if (subscribed) channel.send({ type: "broadcast", event: "stroke:start",
      payload: { strokeId: curStrokeId, authorId: user.id, color, brush, width: STROKE_W, pt: drawingStroke.points[0] } });
    setDrawingFlag(true);
    render();
  });
  board.addEventListener("pointermove", (e) => {
    if (!drawingStroke) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs) { const p = norm(ev); drawingStroke.points.push(p); queuePoint(p); }
    render();
  });
  function endStroke() {
    if (!drawingStroke) return;
    const s = drawingStroke; drawingStroke = null;
    if (sendTimer) { clearTimeout(sendTimer); flushPoints(); }
    if (subscribed) channel.send({ type: "broadcast", event: "stroke:end", payload: { strokeId: curStrokeId } });
    setDrawingFlag(false);
    live.delete(curStrokeId);
    strokes.push(s);
    render();
    syncTierUI();
    ringReady = true; // you left something — now you can ring them to it
    paintRing();
    persist(s);
    markToday();
    queueSnapshot();
  }
  board.addEventListener("pointerup", endStroke);
  board.addEventListener("pointercancel", endStroke);
  board.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") endStroke(); });

  async function persist(s) {
    if (!canvasId) return;
    const { data, error } = await supabase.from("strokes")
      .insert({ canvas_id: canvasId, author_id: user.id, brush: s.brush, color: s.color, width: s.width, points: s.points })
      .select("id").maybeSingle();
    if (data) { s.id = data.id; return; }
    // The DB owns the tiers. If this client's idea of the tier was stale (an
    // old cached page, or an entitlement that lapsed), the insert is rejected
    // here — take the stroke back off the canvas rather than showing the user
    // something their partner will never receive.
    if (error && /PRO_BRUSH/.test(error.message ?? "")) {
      const i = strokes.indexOf(s);
      if (i >= 0) strokes.splice(i, 1);
      if (subscribed) channel.send({ type: "broadcast", event: "canvas:reload", payload: {} });
      render();
      selectBrush("marker");
      openPaywall("brush", () => { syncTierUI(); render(); });
    }
  }

  /* ---------- photo import: preview → instant apply → progress upload ---------- */
  const photoInput = document.getElementById("photoInput");
  const prog = document.getElementById("prog");
  const progFill = document.getElementById("progfill");
  const progLabel = document.getElementById("proglabel");
  document.getElementById("photo").addEventListener("click", () => {
    if (!photosLeft()) {
      openPaywall("photo", () => { syncTierUI(); photoInput.click(); });
      return;
    }
    photoInput.click();
  });

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files && photoInput.files[0];
    photoInput.value = "";
    if (!file || !canvasId) return;
    let blob;
    try { blob = await shrinkImage(file, 1600, 0.85); }
    catch { alert("Couldn't read that image — try another one."); return; }
    openPhotoSheet(URL.createObjectURL(blob), blob);
  });

  function openPhotoSheet(previewUrl, blob) {
    const sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.innerHTML = `
      <div class="card glass">
        <div class="cap">draw on this photo?</div>
        <img src="${previewUrl}" alt="preview" />
        <div class="row">
          <button class="ghost" id="ph-cancel">Cancel</button>
          <button class="primary" id="ph-use">Use as background</button>
        </div>
      </div>`;
    document.body.appendChild(sheet);
    sheet.querySelector("#ph-cancel").onclick = () => { sheet.remove(); URL.revokeObjectURL(previewUrl); };
    sheet.querySelector("#ph-use").onclick = () => { sheet.remove(); applyPhoto(previewUrl, blob); };
  }

  async function applyPhoto(previewUrl, blob) {
    const prevBg = bgString();
    setBg(previewUrl + "#fit=cover&dim=35"); // instant local preview
    showProgress(0);
    try {
      const path = `${coupleId}/${uid()}.jpg`;
      await uploadWithProgress("couple-photos", path, blob, showProgress);
      bgState.url = path; // persist the private storage path; partner resolves a signed URL
      const err = await persistBg();
      if (err) {
        hideProgress();
        setBg(prevBg);
        if (isPhotoLimit(err)) {
          tier.photosToday = Math.max(tier.photosToday, 1);
          openPaywall("photo");
        } else {
          alert("Couldn't set that photo — try again.");
        }
        return;
      }
      tier.photosToday++;
      finishProgress(`on ${partnerName}'s phone ✓`);
    } catch (e) {
      hideProgress();
      setBg(prevBg);
      alert("Upload failed — check your connection and try again.");
    } finally {
      setTimeout(() => URL.revokeObjectURL(previewUrl), 5000);
    }
  }

  async function uploadWithProgress(bucket, path, blob, onProgress) {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error("no session");
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`);
      xhr.setRequestHeader("Authorization", `Bearer ${session.access_token}`);
      xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
      xhr.setRequestHeader("content-type", "image/jpeg");
      xhr.setRequestHeader("cache-control", "3600");
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
      };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error("HTTP " + xhr.status));
      xhr.onerror = () => reject(new Error("network"));
      xhr.send(blob);
    });
  }

  function showProgress(p) {
    prog.style.display = "block";
    progFill.style.width = p + "%";
    progLabel.textContent = p < 100 ? `sending photo… ${p}%` : "almost there…";
  }
  function finishProgress(msg) {
    progFill.style.width = "100%";
    progLabel.textContent = msg;
    setTimeout(() => { prog.style.display = "none"; }, 1400);
  }
  function hideProgress() { prog.style.display = "none"; }

  async function shrinkImage(file, maxSide, quality) {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i); i.onerror = rej;
      i.src = URL.createObjectURL(file);
    });
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", quality));
  }

  /* ---------- toolbar actions ---------- */
  document.getElementById("clear").addEventListener("click", async () => {
    strokes.length = 0; live.clear(); render(); syncTierUI();
    if (subscribed) channel.send({ type: "broadcast", event: "canvas:clear", payload: {} });
    if (canvasId) await supabase.from("strokes").delete().eq("canvas_id", canvasId);
    queueSnapshot();
  });
  document.getElementById("undo").addEventListener("click", async () => {
    for (let i = strokes.length - 1; i >= 0; i--) {
      if (strokes[i].authorId === user.id) {
        const [removed] = strokes.splice(i, 1); render(); syncTierUI();
        if (removed.id) await supabase.from("strokes").delete().eq("id", removed.id);
        if (subscribed) channel.send({ type: "broadcast", event: "canvas:reload", payload: {} });
        queueSnapshot();
        break;
      }
    }
  });
  /* ---------- account ---------- */
  document.getElementById("signout").addEventListener("click", () => openAccount());

  async function signOutNow() {
    stopLive();
    if (channel) supabase.removeChannel(channel);
    await supabase.auth.signOut();
    window.__inCanvas = false;
    renderSignIn();
  }

  function openAccount() {
    if (document.querySelector(".acct")) return;
    const sheet = document.createElement("div");
    sheet.className = "sheet acct";
    sheet.innerHTML = `
      <div class="card glass">
        <h2>Your account</h2>
        <div class="who2">${escapeHtml(user.email ?? "")}${user.email_confirmed_at ? " · confirmed" : ""}</div>
        ${user.email_confirmed_at ? "" : `
        <div class="unverified">
          <h3>Confirm your email</h3>
          <p class="help">Until you do, a forgotten password can't be recovered — there's
            nowhere to send the reset. Mistyped it? Correct it below.</p>
          <button class="mini" id="ac-resend">Resend the link</button>
          <input class="field" id="ac-email" type="email" placeholder="a different email" />
          <button class="mini" id="ac-email-go">Use this address instead</button>
        </div>`}

        <section>
          <h3>Your name</h3>
          <p class="help">This is what ${escapeHtml(partnerName)} sees.</p>
          <input class="field" id="ac-name" maxlength="24" value="${escapeHtml(myName)}" />
          <button class="mini" id="ac-name-go">Save name</button>
        </section>

        <section>
          <h3>Password</h3>
          <input class="field" id="ac-cur" type="password" placeholder="current password" autocomplete="current-password" />
          <input class="field" id="ac-new" type="password" placeholder="new password" autocomplete="new-password" />
          <button class="mini" id="ac-pw-go">Change password</button>
        </section>

        <section>
          <h3>Your canvas</h3>
          <p class="help">Leaving removes your drawings and keeps theirs. You can pair again with a new code afterwards.</p>
          <button class="mini" id="ac-leave">Leave this canvas</button>
        </section>

        <section>
          <h3>Your data</h3>
          <p class="help">Everything you've made, as files you keep: your drawings as SVG you
            can open anywhere, plus your strokes, streak and account details.
            ${escapeHtml(partnerName)}'s drawings stay theirs — they can export their own.</p>
          <button class="mini" id="ac-export">Download my data</button>
        </section>

        <section>
          <h3>Session</h3>
          <button class="mini" id="ac-signout">Sign out</button>
        </section>

        <div class="danger">
          <h3>Delete account</h3>
          <p class="help">Erases your login, your drawings and your streak, permanently.
            ${escapeHtml(partnerName)} keeps their own ink. This cannot be undone.</p>
          <button class="mini del" id="ac-del">Delete my account</button>
        </div>

        <div class="note2" id="ac-note"></div>
        <div class="row"><button class="ghost" id="ac-close">Close</button></div>
      </div>`;
    document.body.appendChild(sheet);
    const note = sheet.querySelector("#ac-note");
    const say = (m) => { note.textContent = m; };

    sheet.querySelector("#ac-close").onclick = () => sheet.remove();

    // only present while the address is unconfirmed
    const resendBtn = sheet.querySelector("#ac-resend");
    if (resendBtn) {
      resendBtn.onclick = async () => {
        const { error } = await supabase.auth.resend({
          type: "signup", email: user.email,
          options: { emailRedirectTo: location.href.split("#")[0] },
        });
        say(error ? "Couldn't send that just now — try again shortly."
                  : `Confirmation link sent to ${user.email}.`);
      };
      sheet.querySelector("#ac-email-go").onclick = async () => {
        const next = sheet.querySelector("#ac-email").value.trim().toLowerCase();
        if (!next.includes("@")) return say("That doesn't look like an email.");
        const { error } = await supabase.auth.updateUser(
          { email: next }, { emailRedirectTo: location.href.split("#")[0] });
        if (error) {
          return say(/already|registered|exists/i.test(error.message)
            ? "That address already has an account."
            : "Couldn't change your email — try again.");
        }
        // the change only lands once the NEW address is confirmed, so a typo
        // here can't strand anyone either
        say(`Sent a link to ${next}. Your email changes once you open it.`);
      };
    }
    sheet.querySelector("#ac-signout").onclick = () => { sheet.remove(); signOutNow(); };

    sheet.querySelector("#ac-export").onclick = async () => {
      const btn = sheet.querySelector("#ac-export");
      btn.disabled = true; say("Gathering everything…");
      const { data, error } = await supabase.functions.invoke("export-my-data", { body: {} });
      btn.disabled = false;
      if (error || !data) return say("Couldn't build your export — try again.");

      const day = new Date().toISOString().slice(0, 10);
      download(`trace-export-${day}.json`, JSON.stringify(data, null, 2), "application/json");
      // the JSON is the record; the SVGs are the actual drawings, openable by
      // anything. Staggered so browsers don't drop the second download.
      (data.canvases ?? []).forEach((c, i) => {
        if (!c.svg) return;
        setTimeout(() => download(`trace-drawing-${day}-${i + 1}.svg`, c.svg, "image/svg+xml"), 400 * (i + 1));
      });
      const n = (data.canvases ?? []).filter(c => c.svg).length;
      say(`Downloaded your data${n ? ` and ${n} drawing${n > 1 ? "s" : ""}` : ""}.`);
    };

    sheet.querySelector("#ac-name-go").onclick = async () => {
      const v = sheet.querySelector("#ac-name").value.trim();
      if (!v) return say("Pick a name they'll recognise.");
      const { error } = await supabase.rpc("set_display_name", { p_name: v });
      if (error) return say("Couldn't save that name — try again.");
      myName = v;
      say("Name updated.");
    };

    sheet.querySelector("#ac-pw-go").onclick = async () => {
      const cur = sheet.querySelector("#ac-cur").value;
      const nw = sheet.querySelector("#ac-new").value;
      if (nw.length < 6) return say("Use at least 6 characters.");
      // re-authenticate first: an unlocked browser shouldn't be enough to lock
      // the real owner out of their account
      const { error: reauth } = await supabase.auth.signInWithPassword({
        email: user.email, password: cur,
      });
      if (reauth) return say("That current password is not right.");
      const { error } = await supabase.auth.updateUser({ password: nw });
      if (error) return say("Couldn't change your password — try again.");
      sheet.querySelector("#ac-cur").value = "";
      sheet.querySelector("#ac-new").value = "";
      say("Password changed.");
    };

    sheet.querySelector("#ac-leave").onclick = async () => {
      if (!confirm(`Leave this canvas? Your drawings are removed. ${partnerName}'s stay.`)) return;
      const { error } = await supabase.rpc("leave_couple");
      if (error) return say("Couldn't leave just now — try again.");
      sheet.remove();
      if (channel) supabase.removeChannel(channel);
      window.__inCanvas = false;
      renderPairing(user);
    };

    // Two confirmations, the second typed. This is the only irreversible thing
    // in the app; it should be harder to do by accident than anything else.
    sheet.querySelector("#ac-del").onclick = async () => {
      if (!confirm("Delete your account? This erases your login and your drawings for good.")) return;
      const typed = prompt('This cannot be undone.\n\nType DELETE to confirm.');
      if (typed !== "DELETE") return say("Not deleted — the confirmation didn't match.");
      say("Deleting…");
      const { data, error } = await supabase.functions.invoke("delete-account", {
        body: { confirm: "DELETE" },
      });
      if (error || !data?.deleted) return say("Couldn't delete your account — try again.");
      if (channel) supabase.removeChannel(channel);
      await supabase.auth.signOut();
      sheet.remove();
      window.__inCanvas = false;
      renderSignIn();
    };
  }

  document.addEventListener("visibilitychange", async () => {
    // a camera should never keep running behind a hidden tab
    if (document.visibilityState !== "visible") stopLive();
    if (document.visibilityState === "visible" && subscribed) {
      // coming back is also when a purchase made on the phone should land here
      await refreshTier();
      syncTierUI();
      loadHistory();
      refreshStreak();
    }
  });

  syncTierUI();
  connect();
}

/* ---------- the paywall ----------
   Purchases run through RevenueCat in the iOS/Android app; there is no card
   form on the web. Because the entitlement is stored per couple on the server,
   buying on either phone unlocks this page too — so the web CTA is "check
   again", not a fake buy button. */
const PAYWALL_REASONS = {
  brush: "That brush is part of Trace Forever.",
  photo: "You've used today's free photo. Trace Forever lifts the limit.",
  replay: "Free replay goes back 7 days. Trace Forever replays everything.",
  info: "One payment. Both of you. Forever.",
};

function openPaywall(reason = "info", onUnlock) {
  if (document.querySelector(".paywall")) return;
  const sheet = document.createElement("div");
  sheet.className = "sheet paywall";
  const li = (ic, text) => `<li><span class="tick">${icon(ic, 16)}</span><span>${text}</span></li>`;
  sheet.innerHTML = `
    <div class="card glass">
      <div class="kicker">trace <span class="ink">forever</span></div>
      <div class="price">${PRICE}<small>one purchase unlocks both of you</small></div>
      <div class="why">${escapeHtml(PAYWALL_REASONS[reason] ?? PAYWALL_REASONS.info)}</div>
      <ul>
        ${li("sparkles", "Every brush — glow, neon, and invisible ink")}
        ${li("infinity", "Unlimited photos, not one a day")}
        ${li("history", "Your whole story in Replay, back to day one")}
        ${li("heart", "Unlocks for your person at the same moment")}
      </ul>
      <div class="row">
        <button class="ghost" id="pw-close">Not now</button>
        <button class="primary" id="pw-check">I've already paid</button>
      </div>
      <div class="note">Trace Forever is bought once in the iOS or Android app.
        It unlocks this page automatically — nothing to enter here.</div>
    </div>`;
  document.body.appendChild(sheet);
  sheet.querySelector("#pw-close").onclick = () => sheet.remove();
  sheet.querySelector("#pw-check").onclick = async () => {
    const btn = sheet.querySelector("#pw-check");
    btn.disabled = true; btn.textContent = "checking…";
    await refreshTier();
    sheet.remove();
    if (tier.isPro) onUnlock?.();
    else openPaywall("info", onUnlock);
  };
}

function download(filename, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
